name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: which swiftlint || brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

  test:
    name: Tests
    needs: lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Build and test (macOS)
        run: swift test

      - name: Build and test (iOS Simulator)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if "iOS" in r and x["name"].startswith("iPhone")))')
          SCHEME=$(xcodebuild -list -json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print("RCT-Package" if "RCT-Package" in s else "RCT")')
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

      - name: Export coverage
        if: success()
        run: xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.json

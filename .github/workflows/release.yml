name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver optionnelle (ex: 1.2.3). Vide : minor suivante."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          requested="$(echo "${REQUESTED}" | xargs)"
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [[ -n "$requested" ]]; then
            tag="${requested#v}"
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version '$tag' (expected X.Y.Z)"
              exit 1
            fi
          elif [[ -z "$latest" ]]; then
            tag="1.0.0"
          else
            IFS='.' read -r major minor _ <<< "$latest"
            tag="${major}.$((minor + 1)).0"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$(git tag --list "$tag" | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-none} → release tag: $tag"

      - name: Create and push tag
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          EXISTS: ${{ steps.version.outputs.exists }}
        run: |
          if [[ "$EXISTS" == "true" ]]; then
            echo "### Tag $TAG already exists, archives will be re-attached" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Tag $TAG created" >> "$GITHUB_STEP_SUMMARY"
          fi

  archive:
    name: Build SPM Archive & Attach to Release
    needs: create-tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.create-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - name: Create archives
        run: |
          set -euo pipefail
          BASE_NAME="RCT-${TAG}-spm"
          FILES="Package.swift README.md LICENSE Sources Tests"
          mkdir -p dist
          tar -czf "dist/${BASE_NAME}.tar.gz" $FILES
          zip -qr "dist/${BASE_NAME}.zip" $FILES

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "RCT $TAG" --generate-notes --verify-tag
          fi
